<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Gallery & Slideshow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Image Gallery</h1>

  <!-- Thumbnail Gallery -->
  <div class="gallery">
    <a href="Images/Charminar.jpg"><img src="Images/Charminar.jpg" alt="Image 1"></a>
    <a href="Images/TajMahal.png"><img src="Images/TajMahal.png" alt="Image 2"></a>
    <a href="Images/Alleppey.jpg"><img src="Images/Alleppey.jpg" alt="Image 3"></a>
    <a href="Images/India Gate.jpg"><img src="Images/India Gate.jpg" alt="Image 4"></a>
  </div>

  <h1>Image Slideshow</h1>

  <!-- Slideshow -->
  <div class="slideshow">
    <div class="slides">
      <img src="Images/Charminar.jpg" alt="Slide 1">
      <img src="Images/TajMahal.png" alt="Slide 2">
      <img src="Images/Alleppey.jpg" alt="Slide 3">
      <img src="Images/India Gate.jpg" alt="Slide 4">
    </div>
  </div>

</body>
</html>
